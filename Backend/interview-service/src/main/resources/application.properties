# ===== Identité du microservice =====
spring.application.name=interview-service
server.port=8086

# ===== Config Server (optionnel : le service démarre même s'il est absent) =====
spring.config.import=optional:configserver:http://localhost:8888

# ===== Base de données MySQL privée (Database-per-Service) =====
# Adapter le port (3306 par défaut, 3307 si XAMPP/WAMP configuré ainsi) et le mot de passe
spring.datasource.url=jdbc:mysql://localhost:3307/interview_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Eureka (annuaire) =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
